<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자바 변수 학습 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3EF;
    --text: #2B2438;
    --text-dim: #7A7488;
    --card-line: #E7E2D8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    padding:48px 18px 60px;
  }
  .wrap{width:100%;max-width:920px;}

  .top{text-align:center;margin-bottom:40px;}
  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.12em;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:32px;
    font-weight:800;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .top p{color:var(--text-dim);font-size:15px;line-height:1.6;margin:0;}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
  }
  @media (max-width: 720px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    position:relative;
    border-radius:26px;
    padding:34px 28px;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    display:block;
    border:1px solid var(--card-line);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-4px);}

  /* card 1 — code sort race: dark, code-editor theme */
  .card.sort{
    background:
      radial-gradient(500px 260px at 90% -10%, rgba(139,124,255,0.35), transparent 60%),
      radial-gradient(420px 240px at 0% 110%, rgba(74,222,156,0.22), transparent 60%),
      #14162170;
    background-color:#14121F;
    box-shadow:0 18px 40px -20px rgba(20,18,31,0.55);
  }
  .card.sort:hover{box-shadow:0 24px 50px -18px rgba(20,18,31,0.65);}
  .card.sort .badge{background:rgba(74,222,156,0.15);color:#4ADE9C;border:1px solid rgba(74,222,156,0.4);}
  .card.sort h2{color:#ECEEF9;}
  .card.sort p{color:#9599B8;}
  .card.sort .cta{background:linear-gradient(135deg,#4ADE9C,#38C08F);color:#08160F;}

  /* card 2 — OX quiz: bright citrus theme */
  .card.ox{
    background:
      radial-gradient(480px 260px at 90% -10%, rgba(255,201,60,0.5), transparent 60%),
      radial-gradient(420px 240px at 0% 110%, rgba(51,198,232,0.35), transparent 60%);
    background-color:#FFF7E8;
    box-shadow:0 18px 40px -20px rgba(230,170,20,0.35);
  }
  .card.ox:hover{box-shadow:0 24px 50px -18px rgba(230,170,20,0.45);}
  .card.ox .badge{background:#FFF0C2;color:#B37A00;border:1px solid #FFDD8A;}
  .card.ox h2{color:#3A2E52;}
  .card.ox p{color:#8A7F98;}
  .card.ox .cta{background:#58C255;color:#fff;box-shadow:0 5px 0 #3FA13E;}

  .badge{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    padding:5px 11px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .icon{font-size:34px;margin-bottom:10px;display:block;}
  .card h2{
    font-family:'Baloo 2',sans-serif;
    font-size:22px;
    font-weight:800;
    margin:0 0 8px;
  }
  .card p{
    font-size:13.5px;
    line-height:1.7;
    margin:0 0 22px;
    min-height:66px;
  }
  .cta{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:12px 20px;
    border-radius:12px;
  }

  footer{text-align:center;color:var(--text-dim);font-size:12px;margin-top:40px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="kicker">JAVA VARIABLES · CLASSROOM GAMES</div>
    <h1>자바 변수 학습 게임</h1>
    <p>원하는 게임을 선택해서 시작하세요. 휴대폰으로도 바로 플레이할 수 있습니다.</p>
  </div>

  <div class="grid">
    <a class="card sort" href="sort-game.html">
      <span class="badge">DRAG &amp; DROP</span>
      <span class="icon">🧩</span>
      <h2>코드 정렬 레이스</h2>
      <p>뒤섞인 자바 코드 카드를 올바른 순서로 끌어서 정렬하는 레이스 게임. 10문제를 풀고 걸린 시간으로 순위를 겨룹니다.</p>
      <span class="cta">시작하기 →</span>
    </a>

    <a class="card ox" href="ox-quiz.html">
      <span class="badge">O / X QUIZ</span>
      <span class="icon">✅</span>
      <h2>변수 OX 퀴즈</h2>
      <p>변수에 관한 문장이 맞는지 틀린지 터치로 답하는 퀴즈. 10문제를 풀고 맞은 개수로 순위를 겨룹니다.</p>
      <span class="cta">시작하기 →</span>
    </a>
  </div>

  <footer>신라대학교 컴퓨터공학과</footer>
</div>
</body>
</html>
